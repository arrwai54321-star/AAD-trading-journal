<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAD Trading Journal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  background:#0b1120;
  color:#e5e7eb;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1400px,94%);
  margin:auto;
}

/* LOGIN */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#172554,#0b1120 55%);
}

.auth-card{
  width:min(450px,100%);
  background:#111827;
  border:1px solid #263244;
  border-radius:24px;
  padding:35px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo h1{
  font-size:30px;
  color:#fff;
}

.logo p{
  margin-top:8px;
  color:#94a3b8;
}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.auth-tabs button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#1f2937;
  color:#94a3b8;
}

.auth-tabs button.active{
  background:#2563eb;
  color:white;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1;
  font-size:14px;
}

input,select,textarea{
  width:100%;
  background:#0f172a;
  border:1px solid #334155;
  color:white;
  border-radius:10px;
  padding:12px 13px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#3b82f6;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
}

.primary-btn:hover{
  background:#1d4ed8;
}

.message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
}

/* APP */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(11,17,32,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1e293b;
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.brand span{
  color:#3b82f6;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-email{
  color:#94a3b8;
  font-size:13px;
}

.logout{
  border:1px solid #475569;
  background:#1e293b;
  color:white;
  padding:9px 14px;
  border-radius:9px;
}

main{
  padding:25px 0 60px;
}

.top-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#111827;
  border:1px solid #1e293b;
  padding:20px;
  border-radius:16px;
}

.stat-title{
  color:#94a3b8;
  font-size:13px;
}

.stat-value{
  font-size:27px;
  font-weight:bold;
  margin-top:8px;
}

.layout{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:20px;
}

.card{
  background:#111827;
  border:1px solid #1e293b;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  font-size:18px;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.add-btn{
  width:100%;
  margin-top:15px;
  border:0;
  border-radius:10px;
  padding:13px;
  background:#16a34a;
  color:white;
  font-weight:bold;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.toolbar>*{
  flex:1;
  min-width:160px;
}

.trade-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.trade{
  background:#0f172a;
  border:1px solid #263244;
  border-radius:14px;
  padding:16px;
}

.trade-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.symbol{
  font-size:18px;
  font-weight:bold;
}

.badge{
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.long{
  background:#064e3b;
  color:#6ee7b7;
}

.short{
  background:#7f1d1d;
  color:#fecaca;
}

.win{
  color:#4ade80;
}

.loss{
  color:#f87171;
}

.be{
  color:#facc15;
}

.trade-info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.info{
  background:#111827;
  padding:9px;
  border-radius:8px;
}

.info small{
  display:block;
  color:#64748b;
  font-size:11px;
}

.info strong{
  display:block;
  margin-top:3px;
}

.trade-notes{
  margin-top:12px;
  color:#cbd5e1;
  white-space:pre-wrap;
}

.trade-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.action{
  border:0;
  padding:8px 12px;
  border-radius:8px;
  color:white;
}

.edit{
  background:#2563eb;
}

.delete{
  background:#dc2626;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:40px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#94a3b8;
}

.photo-preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:10px;
  border-radius:10px;
  background:#020617;
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:1fr;
  }

  .top-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .nav{
    align-items:flex-start;
    flex-direction:column;
    padding:15px 0;
  }

  .user-area{
    width:100%;
    justify-content:space-between;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .trade-info{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="authScreen">

<div class="auth-card">

<div class="logo">
<h1>📊 AAD Trading Journal</h1>
<p>Shared Professional Trading Journal</p>
</div>

<div class="auth-tabs">

<button id="loginTab"
class="active"
onclick="showAuth('login')">
Login
</button>

<button id="signupTab"
onclick="showAuth('signup')">
Create Account
</button>

</div>

<div id="loginForm">

<div class="field">
<label>Email</label>
<input id="loginEmail"
type="email"
placeholder="your@gmail.com">
</div>

<div class="field">
<label>Password</label>
<input id="loginPassword"
type="password"
placeholder="Password">
</div>

<button class="primary-btn"
onclick="loginUser()">
Login
</button>

</div>

<div id="signupForm"
class="hidden">

<div class="field">
<label>Full Name</label>
<input id="signupName"
type="text"
placeholder="Your name">
</div>

<div class="field">
<label>Email</label>
<input id="signupEmail"
type="email"
placeholder="your@gmail.com">
</div>

<div class="field">
<label>Password</label>
<input id="signupPassword"
type="password"
placeholder="Minimum 6 characters">
</div>

<button class="primary-btn"
onclick="signupUser()">
Create Account
</button>

</div>

<div id="authMessage"></div>

</div>

</section>


<!-- APP -->

<div id="app"
class="hidden">

<header>

<div class="container nav">

<div class="brand">
AAD <span>Trading Journal</span>
</div>

<div class="user-area">

<div>
<div id="currentUserName"></div>
<div id="currentUserEmail"
class="user-email"></div>
</div>

<button class="logout"
onclick="logoutUser()">
Logout
</button>

</div>

</div>

</header>


<main>

<div class="container">

<div class="top-grid">

<div class="stat">
<div class="stat-title">
Total Trades
</div>
<div id="totalTrades"
class="stat-value">
0
</div>
</div>

<div class="stat">
<div class="stat-title">
Win Rate
</div>
<div id="winRate"
class="stat-value">
0%
</div>
</div>

<div class="stat">
<div class="stat-title">
Total P&L
</div>
<div id="totalPnl"
class="stat-value">
$0.00
</div>
</div>

<div class="stat">
<div class="stat-title">
Total R
</div>
<div id="totalR"
class="stat-value">
0R
</div>
</div>

</div>


<div class="layout">

<div>

<div class="card">

<h2>➕ Add New Trade</h2>

<div class="field">

<label>Trader</label>

<select id="traderSelect">

<option value="">
Loading...
</option>

</select>

</div>


<div class="form-grid">

<div class="field">
<label>Date</label>
<input id="tradeDate"
type="date">
</div>

<div class="field">
<label>Symbol</label>
<input id="symbol"
placeholder="BTCUSDT / EURUSD / XAUUSD">
</div>

<div class="field">
<label>Direction</label>

<select id="direction">
<option value="Long">
Long
</option>

<option value="Short">
Short
</option>
</select>

</div>

<div class="field">
<label>Result</label>

<select id="result">
<option value="Win">
Win
</option>

<option value="Loss">
Loss
</option>

<option value="BE">
BE
</option>
</select>

</div>

<div class="field">
<label>Entry</label>
<input id="entry"
type="number"
step="any">
</div>

<div class="field">
<label>Stop Loss</label>
<input id="sl"
type="number"
step="any">
</div>

<div class="field">
<label>Take Profit</label>
<input id="tp"
type="number"
step="any">
</div>

<div class="field">
<label>P&L ($)</label>
<input id="pnl"
type="number"
step="any">
</div>

<div class="field">
<label>Risk %</label>
<input id="riskPercent"
type="number"
step="any">
</div>

<div class="field">
<label>R Multiple</label>
<input id="rMultiple"
type="number"
step="any">
</div>

<div class="field">
<label>Strategy</label>
<input id="strategy"
placeholder="SMC / Wyckoff / Breakout">
</div>

<div class="field">
<label>Emotion</label>

<select id="emotion">

<option value="Calm">
Calm
</option>

<option value="Confident">
Confident
</option>

<option value="Fear">
Fear
</option>

<option value="Greed">
Greed
</option>

<option value="Revenge">
Revenge
</option>

<option value="FOMO">
FOMO
</option>

</select>

</div>

<div class="field full">

<label>Notes</label>

<textarea id="notes"
placeholder="Trade analysis, mistakes, lessons...">
</textarea>

</div>

<div class="field full">

<label>Screenshot URL</label>

<input id="imageUrl"
placeholder="Optional image URL">

</div>

</div>


<button class="add-btn"
onclick="addTrade()">

Save Trade

</button>

</div>

</div>


<div>

<div class="card">

<h2>
📚 Shared Trading Journal
</h2>

<div class="toolbar">

<select id="filterTrader"
onchange="renderTrades()">

<option value="">
All Traders
</option>

</select>


<select id="filterResult"
onchange="renderTrades()">

<option value="">
All Results
</option>

<option value="Win">
Win
</option>

<option value="Loss">
Loss
</option>

<option value="BE">
BE
</option>

</select>


<input id="searchTrade"
placeholder="Search symbol / strategy..."
oninput="renderTrades()">

</div>


<div id="tradeList"
class="trade-list">

<div class="loading">
Loading trades...
</div>

</div>

</div>

</div>

</div>

</div>

</main>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://jxbqhaikqwsswnlxlzpa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nW-hpRo-HYB-LjhcaHHW2Q_ih0iMjnX";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
   ===================================================== */

let currentUser = null;
let traders = [];
let trades = [];


/* =====================================================
   AUTH TABS
   ===================================================== */

function showAuth(type){

const loginForm =
document.getElementById("loginForm");

const signupForm =
document.getElementById("signupForm");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

if(type === "login"){

loginForm.classList.remove("hidden");
signupForm.classList.add("hidden");

loginTab.classList.add("active");
signupTab.classList.remove("active");

}else{

loginForm.classList.add("hidden");
signupForm.classList.remove("hidden");

loginTab.classList.remove("active");
signupTab.classList.add("active");

}

}


/* =====================================================
   SIGN UP
   ===================================================== */

async function signupUser(){

const name =
document.getElementById("signupName")
.value.trim();

const email =
document.getElementById("signupEmail")
.value.trim();

const password =
document.getElementById("signupPassword")
.value;

if(!name || !email || !password){

alert(
"Please fill all fields."
);

return;

}

if(password.length < 6){

alert(
"Password must be at least 6 characters."
);

return;

}

const {
data,
error
} =
await db.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:name
}
}

});


if(error){

alert(
error.message
);

return;

}

alert(
"Account created successfully. Please check your email if confirmation is enabled."
);

}


/* =====================================================
   LOGIN
   ===================================================== */

async function loginUser(){

const email =
document.getElementById("loginEmail")
.value.trim();

const password =
document.getElementById("loginPassword")
.value;

if(!email || !password){

alert(
"Please enter your email and password."
);

return;

}

const {
data,
error
} =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(error){

alert(
error.message
);

return;

}

currentUser =
data.user;

await startApp();

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logoutUser(){

await db.auth.signOut();

currentUser = null;

document
.getElementById("app")
.classList.add("hidden");

document
.getElementById("authScreen")
.classList.remove("hidden");

}


/* =====================================================
   START APP
   ===================================================== */

async function startApp(){

document
.getElementById("authScreen")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");


document
.getElementById("currentUserEmail")
.textContent =
currentUser.email;


document
.getElementById("currentUserName")
.textContent =
currentUser.user_metadata?.full_name
|| "Trader";


document
.getElementById("tradeDate")
.value =
new Date()
.toISOString()
.split("T")[0];


await loadTraders();

await loadTrades();

}


/* =====================================================
   LOAD TRADERS
   ===================================================== */

async function loadTraders(){

const {
data,
error
} =
await db
.from("traders")
.select("*")
.order("name");


if(error){

console.error(error);

alert(
"Trader loading error: "
+
error.message
);

return;

}


traders =
data || [];


const traderSelect =
document.getElementById(
"traderSelect"
);

const filterTrader =
document.getElementById(
"filterTrader"
);


traderSelect.innerHTML =
'<option value="">Select Trader</option>';


filterTrader.innerHTML =
'<option value="">All Traders</option>';


traders.forEach(trader => {

traderSelect.innerHTML +=

`<option value="${trader.id}">
${escapeHtml(trader.name)}
</option>`;


filterTrader.innerHTML +=

`<option value="${trader.id}">
${escapeHtml(trader.name)}
</option>`;

});

}


/* =====================================================
   LOAD ALL TRADES
   ===================================================== */

async function loadTrades(){

const {
data,
error
} =
await db
.from("trades")
.select(`
*,
traders (
id,
name
)
`)
.order(
"trade_date",
{
ascending:false
}
);


if(error){

console.error(error);

document
.getElementById("tradeList")
.innerHTML =

`<div class="empty">
${escapeHtml(error.message)}
</div>`;

return;

}


trades =
data || [];


renderTrades();

updateStats();

}


/* =====================================================
   ADD TRADE
   ===================================================== */

async function addTrade(){

const trader_id =
document
.getElementById("traderSelect")
.value;


const trade_date =
document
.getElementById("tradeDate")
.value;


const symbol =
document
.getElementById("symbol")
.value
.trim()
.toUpperCase();


if(!trader_id ||
!trade_date ||
!symbol){

alert(
"Please select Trader, Date and Symbol."
);

return;

}


const trade = {

trader_id:trader_id,

trade_date:trade_date,

symbol:symbol,

direction:
document
.getElementById("direction")
.value,

entry:
numberOrNull("entry"),

sl:
numberOrNull("sl"),

tp:
numberOrNull("tp"),

pnl:
numberOrNull("pnl") || 0,

risk_percent:
numberOrNull("riskPercent") || 0,

r_multiple:
numberOrNull("rMultiple") || 0,

result:
document
.getElementById("result")
.value,

strategy:
document
.getElementById("strategy")
.value
.trim(),

emotion:
document
.getElementById("emotion")
.value,

notes:
document
.getElementById("notes")
.value
.trim(),

image_url:
document
.getElementById("imageUrl")
.value
.trim()

};


const {
error
} =
await db
.from("trades")
.insert(trade);


if(error){

alert(
"Could not save trade: "
+
error.message
);

return;

}


clearTradeForm();

await loadTrades();

}


/* =====================================================
   DELETE
   ===================================================== */

async function deleteTrade(id){

if(!confirm(
"Delete this trade?"
)){

return;

}


const {
error
} =
await db
.from("trades")
.delete()
.eq("id",id);


if(error){

alert(
"Delete failed: "
+
error.message
);

return;

}


await loadTrades();

}


/* =====================================================
   EDIT
   ===================================================== */

async function editTrade(id){

const trade =
trades.find(
item => item.id === id
);


if(!trade)
return;


const symbol =
prompt(
"Symbol",
trade.symbol || ""
);


if(symbol === null)
return;


const pnl =
prompt(
"P&L",
trade.pnl ?? 0
);


if(pnl === null)
return;


const result =
prompt(
"Result: Win / Loss / BE",
trade.result || "Win"
);


if(result === null)
return;


const notes =
prompt(
"Notes",
trade.notes || ""
);


if(notes === null)
return;


const {
error
} =
await db
.from("trades")
.update({

symbol:
symbol
.trim()
.toUpperCase(),

pnl:
Number(pnl) || 0,

result:
result,

notes:
notes

})
.eq(
"id",
id
);


if(error){

alert(
"Update failed: "
+
error.message
);

return;

}


await loadTrades();

}


/* =====================================================
   RENDER TRADES
   ===================================================== */

function renderTrades(){

const traderFilter =
document
.getElementById(
"filterTrader"
)
.value;


const resultFilter =
document
.getElementById(
"filterResult"
)
.value;


const search =
document
.getElementById(
"searchTrade"
)
.value
.toLowerCase()
.trim();


const filtered =
trades.filter(
trade => {


const traderMatch =
!traderFilter
||
trade.trader_id
===
traderFilter;


const resultMatch =
!resultFilter
||
trade.result
===
resultFilter;


const searchMatch =
!search
||
(trade.symbol || "")
.toLowerCase()
.includes(search)
||
(trade.strategy || "")
.toLowerCase()
.includes(search)
||
(trade.traders?.name || "")
.toLowerCase()
.includes(search);


return
traderMatch
&&
resultMatch
&&
searchMatch;


}
);


const list =
document
.getElementById(
"tradeList"
);


if(filtered.length === 0){

list.innerHTML =

`<div class="empty">
No trades found.
</div>`;

return;

}


list.innerHTML =
filtered
.map(
trade => {


const resultClass =
trade.result === "Win"
? "win"
: trade.result === "Loss"
? "loss"
: "be";


const directionClass =
trade.direction === "Long"
? "long"
: "short";


return `

<div class="trade">

<div class="trade-top">

<div>

<div class="symbol">

${escapeHtml(
trade.symbol || "-"
)}

</div>

<div
style="color:#94a3b8;margin-top:5px">

${escapeHtml(
trade.traders?.name
||
"Unknown Trader"
)}

·

${escapeHtml(
trade.trade_date
||
"-"
)}

</div>

</div>


<div>

<span
class="badge ${directionClass}">

${escapeHtml(
trade.direction || "-"
)}

</span>


<span
class="badge ${resultClass}">

${escapeHtml(
trade.result || "-"
)}

</span>

</div>

</div>


<div class="trade-info">

<div class="info">
<small>Entry</small>
<strong>
${trade.entry ?? "-"}
</strong>
</div>


<div class="info">
<small>SL</small>
<strong>
${trade.sl ?? "-"}
</strong>
</div>


<div class="info">
<small>TP</small>
<strong>
${trade.tp ?? "-"}
</strong>
</div>


<div class="info">

<small>P&L</small>

<strong
class="${
trade.pnl >= 0
? "win"
: "loss"
}">

$${Number(
trade.pnl || 0
).toFixed(2)}

</strong>

</div>


<div class="info">

<small>R Multiple</small>

<strong>

${Number(
trade.r_multiple || 0
).toFixed(2)}R

</strong>

</div>


<div class="info">

<small>Risk</small>

<strong>

${Number(
trade.risk_percent || 0
).toFixed(2)}%

</strong>

</div>


<div class="info">

<small>Strategy</small>

<strong>

${escapeHtml(
trade.strategy || "-"
)}

</strong>

</div>


<div class="info">

<small>Emotion</small>

<strong>

${escapeHtml(
trade.emotion || "-"
)}

</strong>

</div>

</div>


${
trade.notes

?

`<div class="trade-notes">
${escapeHtml(
trade.notes
)}
</div>`

:

""

}


${
trade.image_url

?

`<img
class="photo-preview"
src="${escapeAttribute(
trade.image_url
)}"
alt="Trade Screenshot"
>`

:

""

}


<div class="trade-actions">

<button
class="action edit"
onclick="editTrade('${trade.id}')">

Edit

</button>


<button
class="action delete"
onclick="deleteTrade('${trade.id}')">

Delete

</button>

</div>


</div>

`;

}
)
.join("");

}


/* =====================================================
   STATISTICS
   ===================================================== */

function updateStats(){

const total =
trades.length;


const wins =
trades.filter(
t => t.result === "Win"
).length;


const pnl =
trades.reduce(
(sum,t) =>
sum +
Number(t.pnl || 0),
0
);


const totalR =
trades.reduce(
(sum,t) =>
sum +
Number(t.r_multiple || 0),
0
);


const winRate =
total
?
(wins / total) * 100
:
0;


document
.getElementById(
"totalTrades"
)
.textContent =
total;


document
.getElementById(
"winRate"
)
.textContent =
winRate.toFixed(1)
+
"%";


document
.getElementById(
"totalPnl"
)
.textContent =
"$"
+
pnl.toFixed(2);


document
.getElementById(
"totalR"
)
.textContent =
totalR.toFixed(2)
+
"R";

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearTradeForm(){

[
"symbol",
"entry",
"sl",
"tp",
"pnl",
"riskPercent",
"rMultiple",
"strategy",
"notes",
"imageUrl"
]
.forEach(
id => {

document
.getElementById(id)
.value = "";

}
);

}


/* =====================================================
   HELPERS
   ===================================================== */

function numberOrNull(id){

const value =
document
.getElementById(id)
.value;


if(value === "")
return null;


return Number(value);

}


function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return String(
value ?? ""
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================================
   SESSION
   ===================================================== */

async function checkSession(){

const {
data
} =
await db.auth.getSession();


if(
data.session
){

currentUser =
data.session.user;

await startApp();

}

}


/* =====================================================
   AUTH STATE
   ===================================================== */

db.auth.onAuthStateChange(
async (
event,
session
) => {


if(
event === "SIGNED_IN"
&&
session
){

currentUser =
session.user;

await startApp();

}


if(
event === "SIGNED_OUT"
){

document
.getElementById(
"app"
)
.classList
.add("hidden");


document
.getElementById(
"authScreen"
)
.classList
.remove("hidden");

}

}
);


/* =====================================================
   START
   ===================================================== */

checkSession();

</script>
